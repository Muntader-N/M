<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رسالة</title>
<style>
  :root{
    --paper:#efe9df;
    --ink:#20201c;
    --line:#c9c0ae;
    --accent:#7a4b2a;
    --accent-ink:#efe9df;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Georgia","Amiri",serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .sheet{
    width:100%;
    max-width:520px;
    background:#f8f5ee;
    border:1px solid var(--line);
    box-shadow:0 1px 0 var(--line), 0 18px 40px -20px rgba(0,0,0,.35);
    padding:44px 36px;
    position:relative;
  }
  .sheet::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid var(--line);
    pointer-events:none;
  }
  h1{
    margin:0 0 6px;
    font-size:26px;
    font-weight:400;
    letter-spacing:.02em;
  }
  p.sub{
    margin:0 0 28px;
    color:#6b6558;
    font-size:15px;
    line-height:1.6;
  }
  textarea{
    width:100%;
    min-height:150px;
    resize:vertical;
    background:transparent;
    border:none;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:16px 2px;
    font-family:inherit;
    font-size:17px;
    line-height:1.8;
    color:var(--ink);
    outline:none;
  }
  textarea::placeholder{color:#9a9280}
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:20px;
    gap:12px;
  }
  .count{font-size:12px;color:#9a9280}
  button{
    appearance:none;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--accent-ink);
    padding:11px 26px;
    font-family:inherit;
    font-size:15px;
    cursor:pointer;
    transition:opacity .15s ease, transform .05s ease;
  }
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:default}
  .status{
    margin-top:16px;
    font-size:14px;
    min-height:20px;
  }
  .status.ok{color:#3d6b3d}
  .status.err{color:#9c3b2e}
  /* honeypot: hidden field real users never fill, bots often do */
  .hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
</style>
</head>
<body>
  <main class="sheet">
    <h1>رسالة</h1>
    <p class="sub">اكتب ما تريد قوله. لا حاجة لاسم أو بريد، الرسالة تصل مباشرة.</p>
    <form id="f">
      <input class="hp" tabindex="-1" autocomplete="off" name="website" id="website">
      <textarea id="msg" maxlength="2000" placeholder="…" required></textarea>
      <div class="row">
        <span class="count"><span id="c">0</span>/2000</span>
        <button type="submit" id="btn">إرسال</button>
      </div>
      <div class="status" id="status"></div>
    </form>
  </main>

<script>
  // عنوان الـ Worker فقط — لا يوجد أي توكن أو معرّف هنا إطلاقًا
  const ENDPOINT = "https://green-feather-269d.mntdr22mntdr22.workers.dev";
  const form = document.getElementById('f');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  const count = document.getElementById('c');

  msg.addEventListener('input', () => count.textContent = msg.value.length);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = msg.value.trim();
    if (!text) return;

    btn.disabled = true;
    status.textContent = 'جارٍ الإرسال…';
    status.className = 'status';

    try {
      const res = await fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text,
          website: document.getElementById('website').value // honeypot
        })
      });

      if (!res.ok) throw new Error('bad response');

      status.textContent = 'تم الإرسال.';
      status.className = 'status ok';
      form.reset();
      count.textContent = '0';
    } catch (err) {
      status.textContent = 'تعذّر الإرسال، حاول مرة أخرى.';
      status.className = 'status err';
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
